<!doctype html>
<html lang="en" data-sg-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="sg208-button: two accessible Vue 3 buttons, themed with CSS custom properties."
    />
    <meta name="color-scheme" content="light dark" />
    <title>sg208-button</title>
    <script>
      // Apply a saved theme before first paint so the page never flashes.
      try {
        const savedTheme = localStorage.getItem("sg208-theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.dataset.theme = savedTheme;
          document.documentElement.dataset.sgTheme = savedTheme;
        }
      } catch {
        // Storage can be unavailable (private mode); the system theme applies.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p class="noscript">
        This showcase needs JavaScript. The package docs live in the README on
        GitHub: https://github.com/sg208/sg-vue-pkg
      </p>
    </noscript>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
